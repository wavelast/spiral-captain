name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          & $wix extension add --global WixToolset.UI.wixext/5.0.2
          & $wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Build
        shell: cmd
        run: .github\build\package.cmd %GITHUB_REF_NAME:~1%

      - name: Create a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          gh release create "$env:GITHUB_REF_NAME" `
            "dist/SpiralCaptain-$version-x64-setup.msi" `
            "dist/SpiralCaptain-$version-portable.exe" `
            --title "Spiral Captain $version" `
            --generate-notes `
            --draft
